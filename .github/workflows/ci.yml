name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Cap job runtime so a hung background process (mDNS deadlock on a
    # constrained runner, an orphaned websocket server, etc.) can never
    # sit indefinitely and starve the queue. Happy path is ~7 min; 20
    # gives comfortable headroom for cold macOS runners on release tags.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # macOS runs only on release-tag pushes (tags of the form v*).
        # Every-commit macOS is too expensive on GitHub's free-tier runner
        # pool — it starves every PR's queue. The real question "does
        # macOS still work?" matters before we cut a release, not every
        # commit. Tagging v0.8.4 pulls macOS back into the matrix; day-
        # to-day main pushes stay at 8 jobs (Ubuntu + Windows × 4 Python).
        os: ${{ fromJSON((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Dependencies come from the hash-pinned lockfile so a
        # compromised release of a transitive dependency can't be
        # pulled silently at install time. The project itself is then
        # installed with --no-deps so the resolver can't reach outside
        # the lockfile. Regeneration instructions live in the lockfile
        # header and CONTRIBUTING.md.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps

      # Lint / type-check — the IronMesh package lives at the repo root
      # (see pyproject.toml: package-dir.ironmesh = ".").  Ruff + mypy
      # target the root .py files directly, excluding tests/examples.
      - name: Lint with ruff
        run: ruff check . --exclude tests --exclude examples --exclude ironmesh_mcp/__pycache__

      # Type check — the distribution maps the repository root to the
      # `ironmesh` package (see [tool.setuptools.package-dir] in
      # pyproject.toml), so an in-place `mypy .` sees every module under
      # two names and aborts with "Source file found twice" before
      # checking a single file. Instead, stage a copy shaped like the
      # installed layout and run mypy against the real package names.
      # `--platform linux` keeps the error count identical across
      # runner OSes.
      #
      # The gate is blocking: the step fails if the error count exceeds
      # the frozen backlog recorded in .mypy-baseline. New type errors
      # fail CI; clearing old ones lets the baseline ratchet down.
      # TODO(2026-07-01): ratchet .mypy-baseline to 0, then replace this
      # counting gate with a plain blocking `mypy` invocation.
      - name: Type check with mypy (baseline-gated)
        shell: bash
        run: |
          STAGE=.mypy-staging
          rm -rf "$STAGE"
          mkdir -p "$STAGE/ironmesh"
          cp *.py "$STAGE/ironmesh/"
          cp -r adapters "$STAGE/ironmesh/adapters"
          cp -r ironmesh_mcp ironmesh_acp ironmesh_a2a "$STAGE/"
          cp pyproject.toml "$STAGE/"
          find "$STAGE" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          (cd "$STAGE" && mypy ironmesh ironmesh_mcp ironmesh_acp ironmesh_a2a \
              --ignore-missing-imports --platform linux > mypy-report.txt 2>&1) || true
          cat "$STAGE/mypy-report.txt"
          if ! grep -qE '(Found [0-9]+ error|Success: no issues found)' "$STAGE/mypy-report.txt"; then
            echo "FAIL: mypy did not produce a result (crash or config error)."
            exit 1
          fi
          COUNT=$(grep -oE 'Found [0-9]+ error' "$STAGE/mypy-report.txt" | grep -oE '[0-9]+' || echo 0)
          BASELINE=$(grep -m1 -oE '^[0-9]+' .mypy-baseline || true)
          rm -rf "$STAGE"
          if [ -z "$BASELINE" ]; then
            echo "FAIL: .mypy-baseline is missing or unparseable."
            exit 1
          fi
          echo "mypy errors: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "FAIL: mypy error count $COUNT exceeds the recorded baseline $BASELINE."
            echo "Fix the new type errors rather than bumping the baseline."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "NOTE: error count is below baseline — ratchet .mypy-baseline down to $COUNT."
          fi

      # Security scanning — bandit on the repo root, pip-audit on the deps.
      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Security scan (bandit)
        # -lll: only fail on HIGH severity. IronMesh legitimately binds to
        # 0.0.0.0 (B104 Medium) by design — it's a mesh daemon. Other Medium
        # findings are reviewed separately and granted explicit exceptions
        # via `# nosec B### — reason` comments in code.
        run: bandit -r . -lll --exclude ./tests,./examples,./ironmesh_mcp/__pycache__

      - name: Dependency vulnerability audit (pip-audit)
        # Audits the lockfile pins — the exact dependency set installed
        # above — rather than whatever happens to be in the environment.
        run: pip-audit -r requirements.lock --no-deps
        continue-on-error: true
        # Informational — a new CVE shouldn't break CI until we've
        # evaluated the impact. Flip to `continue-on-error: false` once
        # the dep set is stable (review by 2026-10-01: if the lockfile
        # has been quiet for a quarter, make this blocking).

      - name: Run tests with coverage
        env:
          PYTHONIOENCODING: utf-8
          # Result floors — assert the suite actually ran, not merely that
          # pytest exited 0. pytest stays green when a conftest regression
          # or broken optional dependency mass-skips or mass-deselects
          # tests, so "green" alone doesn't prove the checks executed.
          # The suite currently passes ~1067 tests with ~5 skips (the
          # skips are optional-dependency and platform conditionals);
          # floors sit at ~70% of the pass count and ~8x the skip count
          # so routine suite churn never false-alarms while a structural
          # no-op fails loudly. Adjust only as a deliberate change.
          CI_PYTEST_MIN_PASSED: 750
          CI_PYTEST_MAX_SKIPPED: 40
        # scripts/ci-pytest.sh runs pytest, watches its stdout for the
        # passing-summary line, and exits 0 as soon as that line shows
        # up — even if the Python interpreter then hangs in atexit. We
        # observed an 18-minute post-success hang on hosted Ubuntu and
        # Windows runners (likely a non-daemon thread held alive by
        # pytest-asyncio's auto mode + pytest-cov's combiner). Locally
        # the same command exits in ~55 s. Tracking the underlying leak
        # is a separate investigation; the wrapper unblocks CI now.
        # shell: bash so the wrapper runs uniformly on every runner.
        shell: bash
        run: |
          ./scripts/ci-pytest.sh pytest tests/ --ignore=tests/integration -v --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage to Codecov
        # Best-effort: Codecov outages should not fail CI. Multiple uploads
        # per commit are deduplicated server-side; uploading from every
        # matrix combo gives accurate per-OS / per-Python flag breakdowns.
        uses: codecov/codecov-action@v4
        if: always() && hashFiles('coverage.xml') != ''
        with:
          file: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    # Real framework-adapter integration tests. Installs the actual
    # third-party packages (langchain-core, crewai, autogen-agentchat) and
    # stands up live 2-node IronMesh meshes in-process.  Runs on
    # Ubuntu only — mDNS-over-localhost is more reliable there than
    # in the Windows runners, and the adapters are OS-agnostic.
    runs-on: ubuntu-latest
    needs: test
    # Step-level timeout-minutes: 10 already caps the pytest run.
    # Job-level cap is slightly higher to cover install + teardown.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IronMesh + real framework deps
        run: |
          python -m pip install --upgrade pip
          # Same hash-pinned lockfile as the unit-test job.
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
          # Real third-party frameworks, not mocks — deliberately
          # unpinned so the tests track what users actually install.
          # Install each one separately (so one broken package doesn't
          # mask the others' status in the log), then fail the job if
          # any of them didn't install. This must NOT be best-effort:
          # the adapter tests pytest.importorskip these packages, so a
          # silently failed install would turn the whole integration
          # suite into skips while CI stayed green.
          failed=""
          for pkg in langchain-core crewai autogen-agentchat; do
            pip install "$pkg" || failed="$failed $pkg"
          done
          if [ -n "$failed" ]; then
            echo "FAIL: framework install broke for:$failed"
            echo "The adapter integration tests would silently skip without them."
            exit 1
          fi
          # Belt and suspenders: installing is not the same as importing.
          # An import-time crash in an unpinned framework release would
          # also feed importorskip and skip the suite silently.
          python -c "import langchain_core, crewai, autogen_agentchat" || {
            echo "FAIL: a framework installed but does not import."
            exit 1
          }
      - name: Run integration tests
        env:
          PYTHONIOENCODING: utf-8
          # Result floors — assert the adapter tests actually executed.
          # With all three frameworks importable the suite currently runs
          # 15 tests with 0 skips (the AutoGen real-agent test runs on
          # autogen-agentchat, the framework's modern package). The
          # pass floor is ~70% of that, so adding or removing a couple
          # of tests never false-alarms, but a framework that stops
          # importing (mass importorskip) drops the count far below it.
          # The skip ceiling of 0 budgets no known skips: any skip means
          # adapter coverage silently vanished and must be a deliberate,
          # reviewed change here.
          CI_PYTEST_MIN_PASSED: 10
          CI_PYTEST_MAX_SKIPPED: 0
        timeout-minutes: 10
        # Same wrapper as the unit-test job — pytest occasionally hangs
        # in atexit on hosted runners after reporting all tests done
        # (likely a non-daemon thread held alive by pytest-asyncio's
        # auto mode). Without the wrapper the integration job waits
        # for the 10-min step cap even when every test passed.
        shell: bash
        run: |
          ./scripts/ci-pytest.sh pytest tests/integration -v

  qr-fallback:
    # The QR invite-token export degrades gracefully when the optional
    # [qr] extra (segno) is absent. The standard `test` job installs segno
    # (it is test-required so the positive QR path is always exercised),
    # which means the no-segno FALLBACK direction never runs there. This
    # job installs WITHOUT segno, runs the fallback tests, and fails if the
    # fallback test did not actually run — a silent-skip guard so a
    # security-adjacent path can't quietly become untested in both
    # directions.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WITHOUT the [qr] extra (no segno)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pytest>=7.0,<9" "pytest-asyncio>=0.21.0,<1"
          # The whole point of this job: segno must genuinely be absent.
          python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('segno') else 0)" \
            || { echo 'segno is present — this job must run WITHOUT it'; exit 1; }
      - name: Run the QR fallback tests (no segno)
        shell: bash
        run: |
          out=$(python -m pytest tests/test_invite.py::TestQR -v -p no:cacheprovider 2>&1); echo "$out"
          # The no-dep fallback test MUST run and pass here (not skip),
          # otherwise the graceful-degradation direction is untested.
          echo "$out" | grep -q "test_png_returns_false_without_dep PASSED" \
            || { echo 'FAIL: the no-segno PNG fallback test did not run/pass'; exit 1; }
          # And the segno-only positive test MUST skip here (proves the
          # skip condition keys on the dep, not something incidental).
          echo "$out" | grep -q "test_png_writes_valid_token_png SKIPPED" \
            || { echo 'FAIL: the positive PNG test should skip without segno'; exit 1; }

  packaging:
    # Build the wheel + sdist, run scripts/release-smoke.sh against the
    # wheel, and verify the conformance vector tests pass from a fresh
    # sdist install. Catches packaging-only regressions that the unit
    # test job misses (the unit job tests the source tree, not the
    # built artifact). Examples of bugs this gate catches:
    #   - v0.9.0: Dockerfile / pyproject missing COPY ironmesh_a2a /
    #             ironmesh_acp lines (caught now by release-smoke.sh
    #             step [3] required-paths check).
    #   - v0.9.2: MANIFEST.in absent → tests/conformance/vectors/*.json
    #             excluded from sdist → downstream `pytest` collected
    #             0 conformance tests and silently reported success.
    #
    # Triggered on:
    #   - tag pushes (v*) — pre-release verification
    #   - PRs that touch packaging files (pyproject.toml, MANIFEST.in,
    #     Dockerfile, scripts/release-smoke.sh) — early warning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pytest-asyncio
      - name: Build wheel + sdist
        run: python -m build
      - name: Release-smoke gate (wheel content + import surface)
        shell: bash
        run: ./scripts/release-smoke.sh
      - name: Verify sdist contains test fixtures
        shell: bash
        run: |
          set -e
          SDIST=$(ls -t dist/ironmesh-*.tar.gz | head -1)
          TMP=$(mktemp -d)
          tar -xzf "$SDIST" -C "$TMP"
          SRC="$TMP/$(ls "$TMP" | head -1)"
          # Hard fail if conformance vectors missing — they're the
          # cross-language wire-compat contract.
          for v in handshake.skip_channel_binding.json \
                   group.identity_material_derivation.json \
                   group.symmetric_key_derivation.json; do
            if [ ! -f "$SRC/tests/conformance/vectors/$v" ]; then
              echo "FAIL: sdist missing tests/conformance/vectors/$v"
              exit 1
            fi
          done
          # Run the conformance vector tests from the extracted sdist
          # against the locally-built wheel — then assert they actually
          # ran. An empty vectors directory parametrizes the runner to
          # zero cases, which pytest reports as a skip and exits 0, so a
          # green step alone doesn't prove the wire-compat contract was
          # checked. Floor = 4 passed (~70% of the current 6 vectors) so
          # retiring a vector or two never false-alarms while a missing
          # vectors directory fails loudly.
          pip install --quiet "dist/$(ls dist | grep .whl | head -1)"
          cd "$SRC"
          set -o pipefail
          python -m pytest tests/test_conformance_vectors.py --no-header -q | tee conformance-run.txt
          passed=$(grep -oE '[0-9]+ passed' conformance-run.txt | grep -oE '[0-9]+' | head -1)
          if [ "${passed:-0}" -lt 4 ]; then
            echo "FAIL: only ${passed:-0} conformance vector tests passed (floor: 4)."
            echo "The vector suite silently shrank — check tests/conformance/vectors/ in the sdist."
            exit 1
          fi

# bench-smoke removed 2026-04-17. The background-responder pattern it used
# was the direct cause of a ~6-hour stuck CI run, and its multicast/mDNS
# behavior on hosted runners is inherently flaky. The benchmark harness
# itself still lives under tests/harness/ and can be run locally or against
# a staging mesh; pre-release smoke validation is now handled by
# scripts/release-smoke.sh, which exercises the actual built wheel in a
# fresh venv — the thing that matters for shipping, not the thing that
# matters for CI badges.
