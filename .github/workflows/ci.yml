name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Cap job runtime so a hung background process (mDNS deadlock on a
    # constrained runner, an orphaned websocket server, etc.) can never
    # sit indefinitely and starve the queue. Happy path is ~7 min; 20
    # gives comfortable headroom for cold macOS runners on release tags.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # macOS runs only on release-tag pushes (tags of the form v*).
        # Every-commit macOS is too expensive on GitHub's free-tier runner
        # pool — it starves every PR's queue. The real question "does
        # macOS still work?" matters before we cut a release, not every
        # commit. Tagging v0.8.4 pulls macOS back into the matrix; day-
        # to-day main pushes stay at 8 jobs (Ubuntu + Windows × 4 Python).
        os: ${{ fromJSON((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rns]"

      # Lint / type-check — the IronMesh package lives at the repo root
      # (see pyproject.toml: package-dir.ironmesh = ".").  Ruff + mypy
      # target the root .py files directly, excluding tests/examples.
      - name: Lint with ruff
        run: ruff check . --exclude tests --exclude examples --exclude ironmesh_mcp/__pycache__

      - name: Type check with mypy
        # Non-blocking until the existing type-error backlog is cleared.
        run: mypy . --ignore-missing-imports --exclude tests --exclude examples
        continue-on-error: true

      # Security scanning — bandit on the repo root, pip-audit on the deps.
      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Security scan (bandit)
        # -lll: only fail on HIGH severity. IronMesh legitimately binds to
        # 0.0.0.0 (B104 Medium) by design — it's a mesh daemon. Other Medium
        # findings are reviewed separately and granted explicit exceptions
        # via `# nosec B### — reason` comments in code.
        run: bandit -r . -lll --exclude ./tests,./examples,./ironmesh_mcp/__pycache__

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit
        continue-on-error: true
        # Informational — a new CVE shouldn't break CI until we've
        # evaluated the impact. Flip to `continue-on-error: false` once
        # the dep set is stable.

      - name: Run tests with coverage
        env:
          PYTHONIOENCODING: utf-8
        # scripts/ci-pytest.sh runs pytest, watches its stdout for the
        # passing-summary line, and exits 0 as soon as that line shows
        # up — even if the Python interpreter then hangs in atexit. We
        # observed an 18-minute post-success hang on hosted Ubuntu and
        # Windows runners (likely a non-daemon thread held alive by
        # pytest-asyncio's auto mode + pytest-cov's combiner). Locally
        # the same command exits in ~55 s. Tracking the underlying leak
        # is a separate investigation; the wrapper unblocks CI now.
        # shell: bash so the wrapper runs uniformly on every runner.
        shell: bash
        run: |
          ./scripts/ci-pytest.sh pytest tests/ --ignore=tests/integration -v --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage to Codecov
        # Best-effort: Codecov outages should not fail CI. Multiple uploads
        # per commit are deduplicated server-side; uploading from every
        # matrix combo gives accurate per-OS / per-Python flag breakdowns.
        uses: codecov/codecov-action@v4
        if: always() && hashFiles('coverage.xml') != ''
        with:
          file: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    # Real framework-adapter integration tests. Installs the actual
    # third-party packages (langchain-core, crewai, pyautogen) and
    # stands up live 2-node IronMesh meshes in-process.  Runs on
    # Ubuntu only — mDNS-over-localhost is more reliable there than
    # in the Windows runners, and the adapters are OS-agnostic.
    runs-on: ubuntu-latest
    needs: test
    # Step-level timeout-minutes: 10 already caps the pytest run.
    # Job-level cap is slightly higher to cover install + teardown.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IronMesh + real framework deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Real third-party frameworks, not mocks. Each test file
          # pytest.importorskips the ones it needs so a failure here
          # isn't fatal to the others.
          pip install langchain-core crewai pyautogen || true
      - name: Run integration tests
        env:
          PYTHONIOENCODING: utf-8
        timeout-minutes: 10
        # Same wrapper as the unit-test job — pytest occasionally hangs
        # in atexit on hosted runners after reporting all tests done
        # (likely a non-daemon thread held alive by pytest-asyncio's
        # auto mode). Without the wrapper the integration job waits
        # for the 10-min step cap even when every test passed.
        shell: bash
        run: |
          ./scripts/ci-pytest.sh pytest tests/integration -v

  packaging:
    # Build the wheel + sdist, run scripts/release-smoke.sh against the
    # wheel, and verify the conformance vector tests pass from a fresh
    # sdist install. Catches packaging-only regressions that the unit
    # test job misses (the unit job tests the source tree, not the
    # built artifact). Examples of bugs this gate catches:
    #   - v0.9.0: Dockerfile / pyproject missing COPY ironmesh_a2a /
    #             ironmesh_acp lines (caught now by release-smoke.sh
    #             step [3] required-paths check).
    #   - v0.9.2: MANIFEST.in absent → tests/conformance/vectors/*.json
    #             excluded from sdist → downstream `pytest` collected
    #             0 conformance tests and silently reported success.
    #
    # Triggered on:
    #   - tag pushes (v*) — pre-release verification
    #   - PRs that touch packaging files (pyproject.toml, MANIFEST.in,
    #     Dockerfile, scripts/release-smoke.sh) — early warning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pytest-asyncio
      - name: Build wheel + sdist
        run: python -m build
      - name: Release-smoke gate (wheel content + import surface)
        shell: bash
        run: ./scripts/release-smoke.sh
      - name: Verify sdist contains test fixtures
        shell: bash
        run: |
          set -e
          SDIST=$(ls -t dist/ironmesh-*.tar.gz | head -1)
          TMP=$(mktemp -d)
          tar -xzf "$SDIST" -C "$TMP"
          SRC="$TMP/$(ls "$TMP" | head -1)"
          # Hard fail if conformance vectors missing — they're the
          # cross-language wire-compat contract.
          for v in handshake.skip_channel_binding.json \
                   group.identity_material_derivation.json \
                   group.symmetric_key_derivation.json; do
            if [ ! -f "$SRC/tests/conformance/vectors/$v" ]; then
              echo "FAIL: sdist missing tests/conformance/vectors/$v"
              exit 1
            fi
          done
          # Run the conformance vector tests from the extracted sdist
          # against the locally-built wheel. Catches the silent
          # "0 tests collected" failure mode end-to-end.
          pip install --quiet "dist/$(ls dist | grep .whl | head -1)"
          cd "$SRC" && python -m pytest tests/test_conformance_vectors.py --no-header -q

# bench-smoke removed 2026-04-17. The background-responder pattern it used
# was the direct cause of a ~6-hour stuck CI run, and its multicast/mDNS
# behavior on hosted runners is inherently flaky. The benchmark harness
# itself still lives under tests/harness/ and can be run locally or against
# a staging mesh; pre-release smoke validation is now handled by
# scripts/release-smoke.sh, which exercises the actual built wheel in a
# fresh venv — the thing that matters for shipping, not the thing that
# matters for CI badges.
