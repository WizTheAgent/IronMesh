name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Cap job runtime so a hung background process (e.g. an orphaned
    # responder from bench-smoke, or mDNS deadlock on a constrained runner)
    # can never sit forever. Happy path is ~7 min; 20 gives comfortable
    # headroom for cold macOS runners.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Run the macOS slice only on pushes to main — GitHub's hosted
        # macOS runner pool is much smaller than Ubuntu/Windows and four
        # extra macOS jobs per PR starves the queue for everyone. Release
        # pushes (which go to main) still get the full 3-OS matrix.
        os: ${{ fromJSON((github.event_name == 'push' && github.ref == 'refs/heads/main') && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rns]"

      # Lint / type-check — the IronMesh package lives at the repo root
      # (see pyproject.toml: package-dir.ironmesh = ".").  Ruff + mypy
      # target the root .py files directly, excluding tests/examples.
      - name: Lint with ruff
        run: ruff check . --exclude tests --exclude examples --exclude ironmesh_mcp/__pycache__

      - name: Type check with mypy
        # Non-blocking until the existing type-error backlog is cleared.
        run: mypy . --ignore-missing-imports --exclude tests --exclude examples
        continue-on-error: true

      # Security scanning — bandit on the repo root, pip-audit on the deps.
      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Security scan (bandit)
        # -lll: only fail on HIGH severity. IronMesh legitimately binds to
        # 0.0.0.0 (B104 Medium) by design — it's a mesh daemon. Other Medium
        # findings are reviewed separately and granted explicit exceptions
        # via `# nosec B### — reason` comments in code.
        run: bandit -r . -lll --exclude ./tests,./examples,./ironmesh_mcp/__pycache__

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit
        continue-on-error: true
        # Informational — a new CVE shouldn't break CI until we've
        # evaluated the impact. Flip to `continue-on-error: false` once
        # the dep set is stable.

      - name: Run tests with coverage
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest tests/ --ignore=tests/integration -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Check coverage threshold
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest tests/ --ignore=tests/integration --cov=. --cov-fail-under=60 -q
        # 60% floor — the benchmark harness and example scripts aren't
        # covered by tests, so 100% is unrealistic. The core bridge/
        # protocol/store modules sit well above this.
        # Integration tests (tests/integration/) run in the dedicated
        # `integration` job below with the real framework deps.

  integration:
    # Real framework-adapter integration tests. Installs the actual
    # third-party packages (langchain-core, crewai, pyautogen) and
    # stands up live 2-node IronMesh meshes in-process.  Runs on
    # Ubuntu only — mDNS-over-localhost is more reliable there than
    # in the Windows runners, and the adapters are OS-agnostic.
    runs-on: ubuntu-latest
    needs: test
    # Step-level timeout-minutes: 10 already caps the pytest run.
    # Job-level cap is slightly higher to cover install + teardown.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IronMesh + real framework deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Real third-party frameworks, not mocks. Each test file
          # pytest.importorskips the ones it needs so a failure here
          # isn't fatal to the others.
          pip install langchain-core crewai pyautogen || true
      - name: Run integration tests
        env:
          PYTHONIOENCODING: utf-8
        timeout-minutes: 10
        run: |
          pytest tests/integration -v

  bench-smoke:
    # Single-platform smoke test of the benchmark harness — catches
    # regressions where the harness can't even start a local daemon.
    # Non-blocking: mDNS discovery may fail in CI environments where
    # multicast is restricted. The test matrix above covers correctness;
    # this job is informational only.
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Job-level cap kills the background responder process too, not just the
    # harness step — this is the job that hung for ~6 hours overnight when
    # only the step had a timeout.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Harness smoke — client+responder on localhost
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
          IRONMESH_PASSPHRASE: ci-smoke-passphrase-1234567
        run: |
          # Start responder in background, then run a tiny bench sweep.
          python -m tests.harness.bench_responder --name resp --port 18001 \
            --open-discovery --allow-plaintext-ws &
          RESP_PID=$!
          sleep 3
          python tests/harness/mesh_bench.py \
            --target-host 127.0.0.1 --target-port 18001 \
            --target-name resp --client-name cli --client-port 18002 \
            --sizes 64 --trials 3 --trial-timeout 5 \
            --output /tmp/smoke.csv
          kill $RESP_PID || true
          # Verify CSV has content
          test -s /tmp/smoke.csv
