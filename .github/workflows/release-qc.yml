name: release-qc

# Automated quality-control gate. Runs scripts/release-qc.sh on every
# push to main + every v* tag. The script catches the class of bugs
# that historically slipped past manual review: stale version references,
# broken internal links, doc claims drifting from reality, packaging
# regressions, public-facing standard violations.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  qc:
    name: release qc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rns]"
          pip install ruff pyyaml build

      - name: Run release-qc
        run: bash scripts/release-qc.sh
