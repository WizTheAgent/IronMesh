# Release pipeline — a pushed v* tag is the single release trigger.
#
#   tag push  ->  gate (tests + doc-sync)  ->  build  ->  PyPI  ->  Docker  ->  GitHub Release
#
# One-time setup (outside this file):
#   - PyPI Trusted Publishing: on pypi.org, add a GitHub publisher for this
#     repo with workflow "release.yml" and environment "pypi". No API token
#     is stored anywhere — publishing is OIDC-authenticated.
#   - Repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN for the image push.
#   - A repo environment named "pypi" (recommended; lets you require review
#     before a publish).
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # manual run = dry-run: gate + build only, no publish

permissions:
  contents: read

jobs:
  gate:
    name: tests + doc-sync gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags for the CHANGELOG-chain check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rns]"
          pip install ruff pyyaml build
      - name: Tests
        env:
          # Same result floors as the CI unit-test job (see ci.yml): a
          # release gate that exits 0 because the suite mass-skipped or
          # mass-deselected is worse than a red one. The wrapper fails
          # the gate unless at least this many tests actually passed.
          CI_PYTEST_MIN_PASSED: 750
          CI_PYTEST_MAX_SKIPPED: 40
        run: ./scripts/ci-pytest.sh pytest -q -p no:cacheprovider --ignore=tests/integration
      - name: Doc-sync + release-qc gate
        run: bash scripts/release-qc.sh --skip-smoke

  build:
    name: build wheel + sdist
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Validate metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    if: github.event_name == 'push'          # real release only; skipped on dry-run dispatch
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ironmesh/
    permissions:
      id-token: write           # OIDC token for trusted publishing — no API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: build + push Docker image
    needs: gate
    if: github.event_name == 'push'          # real release only; skipped on dry-run dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            wiztheagent/ironmesh:${{ steps.ver.outputs.version }}
            wiztheagent/ironmesh:latest

  github-release:
    name: create GitHub Release
    needs: [pypi, docker]
    if: github.event_name == 'push'          # real release only; skipped on dry-run dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/RELEASE_NOTES_v${{ steps.ver.outputs.version }}.md"
          args=(--title "IronMesh ${{ steps.ver.outputs.version }}")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          case "${GITHUB_REF_NAME}" in
            *-*) args+=(--prerelease) ;;   # e.g. v1.0.0-rc1 / -beta
            *)   args+=(--latest) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" dist/*.whl dist/*.tar.gz
