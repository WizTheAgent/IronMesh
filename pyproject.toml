[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironmesh"
version = "0.7.2"
description = "Local-first agent-to-agent mesh protocol with multi-hop routing, end-to-end encryption, and capability discovery"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    { name = "IronMesh", email = "info@ironmesh.org" },
]
keywords = ["a2a", "agent", "protocol", "p2p", "encryption", "local-first", "websocket", "mdns", "lora", "reticulum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
]
dependencies = [
    "websockets>=12.0",
    "pynacl>=1.5.0",
    "zeroconf>=0.80.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
rns = [
    "rns>=0.9.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
ironmesh = "ironmesh.cli:main"

[project.urls]
Homepage = "https://ironmesh.org"
Documentation = "https://github.com/WizTheAgent/IronMesh/tree/main/docs"
Repository = "https://github.com/WizTheAgent/IronMesh"
Issues = "https://github.com/WizTheAgent/IronMesh/issues"
Changelog = "https://github.com/WizTheAgent/IronMesh/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["ironmesh"]

[tool.setuptools.package-dir]
ironmesh = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
