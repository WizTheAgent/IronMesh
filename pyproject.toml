[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironmesh"
version = "0.8.5.4"
description = "Local-first agent-to-agent mesh protocol with multi-hop routing, end-to-end encryption, and capability discovery"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "IronMesh", email = "info@ironmesh.org" },
]
keywords = ["a2a", "agent", "protocol", "p2p", "encryption", "local-first", "websocket", "mdns", "lora", "reticulum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
]
dependencies = [
    "websockets>=12.0",
    "pynacl>=1.5.0",
    "zeroconf>=0.80.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
rns = [
    "rns>=0.9.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
ironmesh = "ironmesh.cli:main"
ironmesh-mcp = "ironmesh_mcp.server:main"

[project.urls]
Homepage = "https://ironmesh.org"
Documentation = "https://github.com/WizTheAgent/IronMesh/tree/main/docs"
Repository = "https://github.com/WizTheAgent/IronMesh"
Issues = "https://github.com/WizTheAgent/IronMesh/issues"
Changelog = "https://github.com/WizTheAgent/IronMesh/blob/main/CHANGELOG.md"

[tool.setuptools]
# `ironmesh.adapters` is declared explicitly: without it, the framework
# adapters (LangChain / CrewAI / AutoGen) are physically excluded from the
# wheel — discovered during the v0.8.3 pre-release verification sweep.
# Downstream code does `from ironmesh.adapters.langchain_adapter import …`.
packages = ["ironmesh", "ironmesh.adapters", "ironmesh_mcp"]

[tool.setuptools.package-dir]
ironmesh = "."
"ironmesh.adapters" = "adapters"
ironmesh_mcp = "ironmesh_mcp"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "tests",
    "examples",
    "ironmesh_mcp/__pycache__",
    "scripts/test_harness.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line-too-long) — many docstrings and URLs legitimately wrap long.
#   Enforcing it at 100 columns adds churn without catching bugs.
# E402 (module-import-not-at-top) — IronMesh has several modules with
#   conditional/lazy imports inside docstrings or behind try blocks; the
#   rule fires on legitimate patterns.
# F401 in package __init__.py — re-exporting for the public API is
#   the intended use of imports there.
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"ironmesh_mcp/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
# Pin first-party package detection so CI and local agree on import groups.
# Without this, ruff's heuristic can vary by environment (editable install,
# venv layout, etc.) and I001 fires on CI but not locally.
known-first-party = ["ironmesh", "ironmesh_mcp"]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
